        narration: "全美江景项目采用微通风方案，并显示对应设计阶段和服务人员。",
        img: "assets/Screenshot_2026-08-02-00-52-55-774_com.tencent.mm.jpg",
        spots: [["返回案例", "back", 0, 0, 12, 6], ["服务人员", "staffDetail", 5, 82, 90, 10], ["立即获取报价", "appointment", 5, 72, 90, 8]]
      }
    };

    const actions = {
      appointment: "演示提示：留下联系方式后，门店顾问会沟通方案和报价。",
      call: "演示提示：真实小程序会先确认，再调起客服电话。",
      favorite: "演示提示：收藏内容会在登录后同步到个人中心。"
    };

    const pageOrder = chapters.flatMap(chapter => chapter.pages);
    const chapterMap = Object.fromEntries(chapters.map((chapter, index) => [chapter.id, { ...chapter, index }]));
    const historyStack = ["home"];
    let current = "home";
    let toastTimer;
    const shot = document.getElementById("shot");
    const shotScroll = document.getElementById("shotScroll");
    const hotspots = document.getElementById("hotspots");
    const phoneShell = document.getElementById("phoneShell");
    const toast = document.getElementById("toast");
    const loadError = document.getElementById("loadError");
    const pagePill = document.getElementById("pagePill");
    const currentTitle = document.getElementById("currentTitle");
    const chapterNumber = document.getElementById("chapterNumber");
    const chapterTitle = document.getElementById("chapterTitle");
    const narration = document.getElementById("narration");
    const pageNumber = document.getElementById("pageNumber");
    const pageTotal = document.getElementById("pageTotal");
    const progressBar = document.getElementById("progressBar");
    const chapterButtons = document.getElementById("chapters");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const qrDialog = document.getElementById("qrDialog");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function createHotspot([label, target, left, top, width, height]) {
      const button = document.createElement("button");
      button.className = "hotspot";
      button.type = "button";
      button.dataset.label = label;
      button.setAttribute("aria-label", label);
      Object.assign(button.style, { left: left + "%", top: top + "%", width: width + "%", height: height + "%" });
      button.addEventListener("pointerdown", event => {
        const rect = button.getBoundingClientRect();
        button.style.setProperty("--tap-x", event.clientX - rect.left + "px");
        button.style.setProperty("--tap-y", event.clientY - rect.top + "px");
        button.classList.remove("pulse");
        void button.offsetWidth;
        button.classList.add("pulse");
      });
      button.addEventListener("click", () => go(target));
      return button;
    }

    function render(pageId) {
      const page = pages[pageId];
      if (!page) return;
      const pageIndex = pageOrder.indexOf(pageId);
      const chapter = chapterMap[page.chapter];
      current = pageId;
      shotScroll.scrollTop = 0;
      loadError.classList.remove("show");
      shot.classList.add("switching");
      hotspots.replaceChildren(...page.spots.map(createHotspot));
      pagePill.textContent = page.title;
      currentTitle.textContent = page.title;
      chapterNumber.textContent = "CHAPTER " + String(chapter.index + 1).padStart(2, "0");
      chapterTitle.textContent = chapter.label;
      narration.textContent = page.narration || chapter.narration;
      pageNumber.textContent = String(pageIndex + 1).padStart(2, "0");
      pageTotal.textContent = String(pageOrder.length).padStart(2, "0");
      progressBar.style.width = (pageIndex + 1) / pageOrder.length * 100 + "%";
      previousButton.disabled = pageIndex === 0;
      nextButton.disabled = pageIndex === pageOrder.length - 1;
      chapterButtons.querySelectorAll(".chapter").forEach(button => button.classList.toggle("active", button.dataset.chapter === page.chapter));
      shot.src = page.img;
      shot.alt = page.title + "小程序截图";
    }

    function go(target, options = {}) {
      if (actions[target]) { showToast(actions[target]); return; }
      if (target === "back") {
        if (historyStack.length > 1) historyStack.pop();
        render(historyStack[historyStack.length - 1]);
        return;
      }
      if (!pages[target]) { showToast("这个演示页面暂时不可用。"); return; }
      if (options.resetHistory) historyStack.splice(0, historyStack.length, target);
      else if (target !== current) historyStack.push(target);
      render(target);
    }

    function step(delta) {
      const target = pageOrder[pageOrder.indexOf(current) + delta];
      if (target) go(target);
    }

    chapters.forEach(chapter => {
      const button = document.createElement("button");
      button.className = "chapter";
      button.type = "button";
      button.dataset.chapter = chapter.id;
      button.textContent = chapter.label;
      button.addEventListener("click", () => go(chapter.entry, { resetHistory: true }));
      chapterButtons.appendChild(button);
    });
    Object.entries(pages).forEach(([pageId, page]) => page.spots.forEach(([, target]) => {
      if (target !== "back" && !pages[target] && !actions[target]) console.error("未知热点目标", pageId, target);
    }));
    shot.addEventListener("load", () => { shot.classList.remove("switching"); loadError.classList.remove("show"); });
    shot.addEventListener("error", () => { shot.classList.remove("switching"); loadError.textContent = "截图加载失败：" + pages[current].img; loadError.classList.add("show"); });
    previousButton.addEventListener("click", () => step(-1));
    nextButton.addEventListener("click", () => step(1));
    document.getElementById("zonesButton").addEventListener("click", event => {
      phoneShell.classList.toggle("show-zones");
      event.currentTarget.textContent = phoneShell.classList.contains("show-zones") ? "隐藏热点" : "显示热点";
    });
    document.getElementById("resetButton").addEventListener("click", () => { go("home", { resetHistory: true }); showToast("已回到演示起点。"); });
    document.getElementById("qrButton").addEventListener("click", () => qrDialog.showModal());
    document.getElementById("qrCloseButton").addEventListener("click", () => qrDialog.close());
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") step(-1);
      if (event.key === "ArrowRight") step(1);
      if (event.key === "Escape" && qrDialog.open) qrDialog.close();
    });
    render("home");
  </script>
</body>
</html>
